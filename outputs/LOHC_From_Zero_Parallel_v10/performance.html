<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOHC 总评分富集</title>
<script src="/plotly.js"></script>
<style>
:root{color-scheme:light;--ink:#222039;--muted:#655e72;--line:#e6deea;--paper:#f8f5f9;--a:#365d9c;--c:#a23568}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}
main{max-width:1280px;margin:auto;padding:24px clamp(12px,4vw,46px)}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:17px}
h1{font-size:clamp(25px,4vw,38px);letter-spacing:-.035em;margin:0 0 7px}
p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}
a{color:#66337d;white-space:nowrap}
.controls,.card{border:1px solid var(--line);border-radius:14px;background:white}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px;margin-bottom:12px}
.controls label{font-size:13px}
select,button{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:6px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.cards .card{padding:10px 14px}
.card h2{font-size:15px;margin:0 0 5px}
.a{color:var(--a)}.c{color:var(--c)}
.figure{overflow:hidden}
.plot{height:clamp(410px,70vh,710px)}
.figure p,.method{padding:9px 15px}
#live{margin-top:10px}
@media(max-width:510px){header{flex-direction:column}.cards .card{padding:8px}.plot{height:450px}}
</style>
<main>
  <header><div><h1>LOHC 总评分富集</h1><p>X、Y 是分子结构坐标，Z 是总评分 F</p></div>
    <a href="/structure">结构曲面与运行控制</a></header>
  <div class="controls">
    <label>共同 GNN 预算 <select id="caps" aria-label="共同 GNN 预算"></select></label>
    <label>显示组 <select id="arm" aria-label="显示组"><option value="both">A 与 C</option><option value="native">A 固定 QD</option><option value="llm">C LLM 干预</option></select></label>
    <label><input type="checkbox" id="unknown" checked> 显示未知区间</label>
    <button id="reset" type="button">重置视角</button>
  </div>
  <section class="cards" aria-label="父代盲评汇总">
    <article class="card"><h2 class="a">A · 固定 QD</h2><p id="native">等待盲评</p></article>
    <article class="card"><h2 class="c">C · LLM 干预</h2><p id="llm">等待盲评</p></article>
  </section>
  <section class="card figure" aria-label="结构空间中的 F 总分">
    <div id="plot" class="plot" aria-label="X Y 结构降维，Z 总评分 F 的可旋转三维图"></div>
    <p id="legend">点表示可判定的 F；竖线表示分数区间；水平面标出 F = 60。没有分数点的竖线表示证据不足。</p>
  </section>
  <p class="method" id="method"></p>
  <p id="live" role="status"></p>
</main>
<script>
"use strict";
const arms=["native","llm"];
const labels={native:"A 固定 QD",llm:"C LLM 干预"};
const color={native:"#365d9c",llm:"#a23568"};
const byId=id=>document.getElementById(id);
const format=x=>Number(x).toLocaleString("zh-CN");
const numeric=x=>Number(x).toFixed(1);
const caps=byId("caps");
const cameraDefault={eye:{x:1.55,y:1.55,z:1.12},projection:{type:"orthographic"}};
let camera=cameraDefault;
let data={stages:{},statuses:{}};
let version="";
let pending=false;

function bounds(values){
  if(!values.length) return [-1,1];
  const lo=Math.min(...values), hi=Math.max(...values), pad=Math.max(.15,(hi-lo)*.12);
  return [lo-pad,hi+pad];
}
function hover(row,arm){
  return labels[arm]+"<br>"+row.smiles+"<br>父格 "+row.cell+"<br>骨架 "+row.scaffold+
    "<br>"+(row.value===null?"F 未知":"F "+numeric(row.value))+" · 区间 "+row.bounds.map(numeric).join("–");
}
function intervalTrace(rows,arm,known){
  const selected=rows.filter(row=>(row.value!==null)===known);
  const trace={type:"scatter3d",mode:"lines",name:labels[arm]+(known?"评分区间":"未知区间"),showlegend:!known,
    x:[],y:[],z:[],text:[],line:{color:color[arm],width:known?4:3},opacity:known?.55:.28,
    hovertemplate:"%{text}<extra></extra>",connectgaps:false};
  for(const row of selected){
    trace.x.push(row.xy[0],row.xy[0],null);
    trace.y.push(row.xy[1],row.xy[1],null);
    trace.z.push(...row.bounds,null);
    trace.text.push(hover(row,arm),hover(row,arm),null);
  }
  return trace;
}
function render(){
  const stage=data.stages[caps.value], which=byId("arm").value, showUnknown=byId("unknown").checked;
  const key=[caps.value,which,showUnknown,Object.keys(data.stages).join(",")].join("|");
  if(key===version) return;
  version=key;
  for(const arm of arms){
    const group=stage?.arms[arm], cutoff=stage?.cutoffs[arm];
    byId(arm).textContent=group?
      "G"+cutoff.generation+" · "+format(cutoff.gnn_pairs)+" 对 GNN · 可判定 "+group.usable+"/"+group.sampled+
      " · 高 F "+group.confirmed_high_f+" 个 · 高分骨架 "+group.high_f_scaffolds+" 个"+
      (group.usable===0?" · 尚无法判定富集":""):"等待共同预算盲评";
  }
  byId("method").textContent=data.reference_size?
    "结构坐标以同一初始种群的 "+format(data.reference_size)+" 个分子拟合。使用 Morgan 指纹和固定 PCA 基底，两组及各预算节点共用坐标。图中只绘制独立盲评抽样。":"";
  const all=Object.values(data.stages).flatMap(s=>arms.flatMap(a=>s.arms[a].points));
  const xr=bounds(all.map(r=>r.xy[0])), yr=bounds(all.map(r=>r.xy[1]));
  const threshold=data.high_f||60;
  const traces=[];
  if(stage){
    traces.push({type:"surface",x:xr,y:yr,z:[[threshold,threshold],[threshold,threshold]],
      colorscale:[[0,"#c8b5cc"],[1,"#c8b5cc"]],showscale:false,opacity:.20,hoverinfo:"skip"});
    for(const arm of arms.filter(a=>which==="both"||which===a)){
      const rows=stage.arms[arm].points;
      const known=rows.filter(r=>r.value!==null);
      traces.push(intervalTrace(rows,arm,true));
      if(showUnknown) traces.push(intervalTrace(rows,arm,false));
      traces.push({type:"scatter3d",mode:"markers",name:labels[arm]+" F",
        x:known.map(r=>r.xy[0]),y:known.map(r=>r.xy[1]),z:known.map(r=>r.value),
        text:known.map(r=>hover(r,arm)),hovertemplate:"%{text}<extra></extra>",
        marker:{color:color[arm],size:known.map(r=>r.high?8:5),line:{color:"#fff",width:1}}});
    }
  }
  const axis={backgroundcolor:"#faf7fb",gridcolor:"#e8e1ed",showbackground:true,zeroline:false};
  Plotly.react("plot",traces,{
    uirevision:"structure-f",paper_bgcolor:"white",margin:{l:6,r:6,t:18,b:8},
    legend:{orientation:"h",x:.02,y:.03,xanchor:"left"},
    annotations:stage?[]:[{text:"等待共同 GNN 预算节点的父代盲评",xref:"paper",yref:"paper",x:.5,y:.5,showarrow:false}],
    scene:{camera,uirevision:"structure-f",dragmode:"orbit",aspectratio:{x:1,y:1,z:.9},
      xaxis:{...axis,title:"结构 PC1",range:xr},yaxis:{...axis,title:"结构 PC2",range:yr},
      zaxis:{...axis,title:"总评分 F",range:[0,100],tickvals:[0,20,40,60,80,100]}}
  },{responsive:true,displaylogo:false}).then(plot=>{
    if(!plot.cameraBound){
      plot.on("plotly_relayout",e=>{if(e["scene.camera"]) camera=structuredClone(e["scene.camera"]);});
      plot.cameraBound=true;
    }
  });
}

async function refresh(){
  if(pending) return;
  pending=true;
  try{
    const res=await fetch("/api/performance",{cache:"no-store"});
    if(!res.ok) throw new Error("state");
    data=await res.json();
    const keys=Object.keys(data.stages).sort((a,b)=>+a-+b);
    const old=[...caps.options].map(o=>o.value);
    if(keys.join(",")!==old.join(",")){
      const current=caps.value;
      const follow=!current||current===old.at(-1);
      caps.replaceChildren(...keys.map(v=>new Option(format(v)+" 对",v)));
      caps.value=follow?(keys.at(-1)||""):current;
    }
    caps.disabled=!keys.length;
    byId("live").textContent=arms.map(a=>labels[a]+" · G"+(data.statuses[a]?.completed_generation??"—")+
      " · "+(data.statuses[a]?.phase||"等待")).join(" ｜ ");
    render();
  }catch(_){byId("live").textContent="暂未连接到评分数据，正在重试。";}
  finally{pending=false;}
}
for(const id of ["caps","arm","unknown"]) byId(id).addEventListener("change",render);
byId("reset").addEventListener("click",()=>{
  camera=structuredClone(cameraDefault);
  Plotly.relayout("plot",{"scene.camera":camera});
});
refresh();
setInterval(refresh,4000);
</script>
</html>
